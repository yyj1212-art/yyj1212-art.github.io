name: Rename CV PDF

on:
  push:
    branches:
      - rename-cv-yangyoungjin

permissions:
  contents: write

jobs:
  rename-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename PDF and set metadata
        run: |
          python -m pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter

          old = "CV/Youngjin_Yang_CV.pdf"
          new = "CV/cv_yangyoungjin.pdf"

          reader = PdfReader(old)
          writer = PdfWriter()

          for page in reader.pages:
              writer.add_page(page)

          metadata = dict(reader.metadata or {})
          metadata.update({
              "/Title": "cv_yangyoungjin",
              "/Author": "Youngjin Yang",
              "/Subject": "Curriculum Vitae",
          })
          writer.add_metadata(metadata)

          with open(new, "wb") as f:
              writer.write(f)
          PY

          rm CV/Youngjin_Yang_CV.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace("/CV/Youngjin_Yang_CV.pdf", "/CV/cv_yangyoungjin.pdf")
          s = s.replace("CV/Youngjin_Yang_CV.pdf", "CV/cv_yangyoungjin.pdf")
          p.write_text(s)
          PY

          rm .github/workflows/rename-cv.yml
          git config user.name "yyj1212-art"
          git config user.email "yyj1212-art@users.noreply.github.com"
          git add -A
          git commit -m "Rename CV PDF and update metadata"
          git push
