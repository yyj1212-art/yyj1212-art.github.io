<style>
:root{--bg:#EEF2F0;--text:#292929;--muted:#717773;--line:#D7DDD9;--accent:#6F837A}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 42px}a{color:inherit;text-decoration:none}
.top{padding:58px 0 65px}.back{font-size:12px;color:var(--muted)}.kicker{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:28px 0 14px}
h1{font-size:clamp(56px,8vw,90px);line-height:.9;letter-spacing:-.065em;font-weight:600;margin:0}.lead{max-width:700px;color:var(--muted);font-size:14px;line-height:1.75;margin:24px 0 0}
section{border-top:1px solid var(--line);padding:38px 0 46px;display:grid;grid-template-columns:170px 1fr;gap:55px}h2{font-size:16px;margin:0;font-weight:600}.content{max-width:700px}
p{font-size:13px;line-height:1.75;color:var(--muted);margin:0 0 14px}.item{margin-bottom:27px}.meta{font-size:10px;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}.title{font-size:15px;font-weight:600}.desc{font-size:12px;line-height:1.7;color:var(--muted);margin-top:6px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{font-size:10px;border:1px solid var(--line);padding:6px 8px;color:var(--muted)}
.footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:10px}@media(max-width:700px){.wrap{padding:0 22px}section{grid-template-columns:1fr;gap:18px}.top{padding-top:38px}h1{font-size:58px}}
</style>
